<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="edu-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Graduation Cap 1 -->
      <g transform="translate(25, 20) rotate(-10) scale(0.75)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 22 10 L 42 20 L 22 30 L 2 20 Z" />
        <path d="M 8 23.5 V 36 C 8 36 15 42 22 42 C 29 42 36 36 36 36 V 23.5" />
        <path d="M 42 20 V 38" />
        <circle cx="42" cy="40" r="2.5" fill="#E2E8F0" />
      </g>

      <!-- Laptop with </> -->
      <g transform="translate(115, 25) rotate(8) scale(0.7)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="6" width="34" height="24" rx="3" />
        <path d="M 2 34 H 48 L 44 30 H 6 Z" />
        <path d="M 17 14 L 13 18 L 17 22" />
        <path d="M 31 14 L 35 18 L 31 22" />
        <path d="M 26 13 L 22 23" />
      </g>

      <!-- Brackets {} -->
      <g transform="translate(75, 85) rotate(-5) scale(0.7)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 6 C 6 6 6 12 6 16 C 6 20 2 22 2 22 C 2 22 6 24 6 28 C 6 32 6 38 12 38" />
        <path d="M 28 6 C 34 6 34 12 34 16 C 34 20 38 22 38 22 C 38 22 34 24 34 28 C 34 32 34 38 28 38" />
      </g>

      <!-- Notebook / Document -->
      <g transform="translate(145, 110) rotate(-12) scale(0.7)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="4" width="28" height="36" rx="3" />
        <line x1="14" y1="12" x2="30" y2="12" />
        <line x1="14" y1="18" x2="30" y2="18" />
        <line x1="14" y1="24" x2="24" y2="24" />
      </g>

      <!-- Coffee Cup -->
      <g transform="translate(20, 140) rotate(12) scale(0.65)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 6 10 H 34 V 28 C 34 34 28 38 20 38 C 12 38 6 34 6 28 Z" />
        <path d="M 34 14 H 40 C 43 14 45 17 45 20 C 45 23 43 26 40 26 H 34" />
        <path d="M 14 5 Q 17 2 14 -1" />
        <path d="M 20 5 Q 23 2 20 -1" />
        <path d="M 26 5 Q 29 2 26 -1" />
      </g>

      <!-- Mobile Device -->
      <g transform="translate(170, 15) rotate(15) scale(0.65)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="4" width="20" height="36" rx="4" />
        <line x1="16" y1="34" x2="24" y2="34" />
      </g>

      <!-- Graduation Cap 2 -->
      <g transform="translate(110, 155) rotate(-8) scale(0.7)" stroke="#E2E8F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 22 10 L 42 20 L 22 30 L 2 20 Z" />
        <path d="M 8 23.5 V 36 C 8 36 15 42 22 42 C 29 42 36 36 36 36 V 23.5" />
        <path d="M 42 20 V 38" />
        <circle cx="42" cy="40" r="2.5" fill="#E2E8F0" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFC" />
  <rect width="100%" height="100%" fill="url(#edu-pattern)" />
</svg>
